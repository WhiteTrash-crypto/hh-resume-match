[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Non-secret config keys often duplicated in docs/defaults — omit from scan
  SECRETS_SCAN_OMIT_KEYS = "APIFY_ACTOR,OPENAI_MODEL,VITE_GOOGLE_SA_EMAIL,PUBLIC_GOOGLE_SA_EMAIL,GOOGLE_SA_PATH,GOOGLE_SA_JSON,NETLIFY_DEV"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"
  included_files = ["shared/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
