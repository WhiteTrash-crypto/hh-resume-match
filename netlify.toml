[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Non-secret config keys often duplicated in docs/defaults — omit from scan
  SECRETS_SCAN_OMIT_KEYS = "OPENAI_MODEL,VITE_GOOGLE_SA_EMAIL,PUBLIC_GOOGLE_SA_EMAIL,GOOGLE_SA_PATH,GOOGLE_SA_JSON,GOOGLE_SA_JSON_BASE64,NETLIFY_DEV,NETLIFY_LOCAL,VITE_TITLE_PREFIX,ACCESS_KEYS_SHEET_ID,ACCESS_KEYS_SHEET_TAB,ACCESS_KEYS_SHEET,HH_USER_AGENT,HH_SCRAPE_MODE,APIFY_ACTOR"

# Tab title prefix only when building the stage branch (not production/main)
[context.stage.environment]
  VITE_TITLE_PREFIX = "[STAGE] "

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"
  included_files = ["shared/**"]
  external_node_modules = ["playwright"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
